[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "proteinstrain"
version = "0.6.0"
description = "Finite strain analysis of protein structures."
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.83",
    "gemmi>=0.6.5",
    "matplotlib>=3.8",
    "numba>=0.59",
    "numpy>=1.24",
    "pandas>=2.1",
    "py3Dmol>=2.4",
    "scipy>=1.11",
]

[dependency-groups]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proteinstrain = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]